<!doctype html>
<html>
    <head>
        <title>Finnhub tracker</title>
        <style>
            td {
                border: 1px solid;
            }
        </style>
    </head>

    <body>
        <input type="integer" id="min" placeholder="min" />
        <input type="integer" id="sec" placeholder="sec" />
        <input id="symbol" placeholder="symbol" />
        <button onclick="GetPrices()">submit</button>

        <br />
        <br />
        <table>
            <thead>
                <tr>
                    <th>Open Price</th>
                    <th>High Price</th>
                    <th>Low Price</th>
                    <th>Current Price</th>
                    <th>Previous Close Price</th>
                    <th>Time</th>
                </tr>
            </thead>
            <tbody id="tbody">
                <tr>
                    <td id="open"></td>
                    <td id="high"></td>
                    <td id="low"></td>
                    <td id="current"></td>
                    <td id="previous-close"></td>
                    <td id="time"></td>
                </tr>
            </tbody>
        </table>

        <script src="index.js"></script>
    </body>
</html>
